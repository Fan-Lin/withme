<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#1C3829"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<title>WithMe</title>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
:root{--bg:#0f1f18;--surface:#1a2e23;--surface2:#243d2f;--border:#2d5240;--gold:#C9A96E;--gold-dim:#8a7050;--text:#e8e0d0;--text-dim:#8a9e8f;--red:#c97070;--font-display:'Cormorant Garamond',serif;--font-body:'DM Sans',sans-serif;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
[data-theme="classic"]{--bg:#1a1208;--surface:#2a1f0f;--surface2:#362a14;--border:#5a4020;--gold:#D4A853;--gold-dim:#8a6830;--text:#f0e6cc;--text-dim:#9a8060;--red:#c07060;--font-display:'Noto Serif SC',serif}
[data-theme="journal"]{--bg:#f5f0e8;--surface:#ede6d8;--surface2:#e0d8c8;--border:#c8bca8;--gold:#8B6914;--gold-dim:#b89040;--text:#2a2018;--text-dim:#7a6848;--red:#a03030;--font-display:'Caveat',cursive}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column;transition:background .3s,color .3s}
#map{flex:1;width:100%;position:relative;z-index:1}
.leaflet-tile-pane{filter:saturate(.7) brightness(.85)}
[data-theme="journal"] .leaflet-tile-pane{filter:saturate(.5) brightness(1.05) sepia(.2)}
[data-theme="classic"] .leaflet-tile-pane{filter:saturate(.5) brightness(.8) sepia(.3)}
.leaflet-container{background:var(--bg)}
#topbar{position:absolute;top:calc(12px + var(--safe-top));left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:0 16px;pointer-events:none;transition:opacity .2s,transform .2s}
#topbar.hidden{opacity:0;pointer-events:none;transform:translateY(-8px)}
#city-pill{pointer-events:all;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:8px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text);backdrop-filter:blur(8px)}
#city-pill:active{border-color:var(--gold)}
#city-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
#top-actions{pointer-events:all;display:flex;gap:8px}
.top-btn{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px)}
.top-btn:active{background:var(--surface2);border-color:var(--gold)}
#bottom-nav{position:absolute;bottom:calc(24px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:500;background:var(--surface);border:1px solid var(--border);border-radius:32px;padding:6px;display:flex;gap:4px;backdrop-filter:blur(12px)}
.nav-btn{padding:10px 18px;border-radius:26px;border:none;background:transparent;color:var(--text-dim);font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.nav-btn.active{background:var(--gold);color:#1a1a0e;font-weight:600}
#fab{position:absolute;bottom:calc(104px + var(--safe-bottom));right:20px;z-index:500;width:52px;height:52px;border-radius:50%;background:var(--gold);border:none;color:#1a1a0e;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(201,169,110,.35);transition:transform .15s,opacity .2s}
#fab:active{transform:scale(.93)}
#fab.hidden{opacity:0;pointer-events:none}
#locate-btn,#heatmap-btn{position:absolute;right:20px;z-index:500;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);transition:border-color .2s,opacity .2s}
#locate-btn{bottom:calc(168px + var(--safe-bottom));font-size:20px}
#heatmap-btn{bottom:calc(224px + var(--safe-bottom));font-size:18px}
#locate-btn:active,#heatmap-btn:active{border-color:var(--gold)}
.map-btn-hidden{opacity:0!important;pointer-events:none!important}
#heatmap-btn.active-heat{border-color:var(--gold);background:var(--surface2)}
.panel{position:absolute;inset:0;z-index:400;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
.panel.open{display:flex}
.panel-header{padding:calc(16px + var(--safe-top)) 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.panel-title{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--text);flex:1}
.panel-back{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:none;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.panel-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sheet-overlay{position:absolute;inset:0;z-index:600;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.sheet-overlay.open{display:flex}
.sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding-bottom:calc(24px + var(--safe-bottom));max-height:85dvh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 8px;flex-shrink:0}
.sheet-title{font-family:var(--font-display);font-size:20px;font-weight:600;padding:8px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.sheet-body{padding:16px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:var(--font-body);font-size:15px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:none;min-height:80px;line-height:1.5}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emoji-btn{aspect-ratio:1;border-radius:10px;background:var(--bg);border:1.5px solid var(--border);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,background .15s}
.emoji-btn.selected{border-color:var(--gold);background:rgba(201,169,110,.12)}
.mood-grid,.weather-grid,.tag-grid{display:flex;gap:8px;flex-wrap:wrap}
.mood-btn,.weather-btn,.tag-btn{padding:8px 14px;border-radius:20px;background:var(--bg);border:1.5px solid var(--border);font-size:16px;cursor:pointer;transition:border-color .15s}
.mood-btn.selected,.weather-btn.selected,.tag-btn.selected{border-color:var(--gold);background:rgba(201,169,110,.12)}
.tag-btn{font-size:12px;display:flex;align-items:center;gap:4px}
.btn-primary{width:100%;padding:14px;border-radius:12px;background:var(--gold);border:none;color:#1a1a0e;font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:opacity .15s}
.btn-primary:active{opacity:.85}
.btn-secondary{width:100%;padding:13px;border-radius:12px;background:transparent;border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:15px;cursor:pointer;margin-top:8px}
.btn-secondary:active{border-color:var(--gold)}
.btn-danger{width:100%;padding:13px;border-radius:12px;background:transparent;border:1px solid #5a2020;color:var(--red);font-family:var(--font-body);font-size:15px;cursor:pointer;margin-top:8px}
.diary-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;transition:border-color .2s;position:relative;overflow:hidden}
.diary-card:active{border-color:var(--gold)}
.diary-date{font-size:11px;color:var(--text-dim);margin-bottom:4px;letter-spacing:.05em}
.diary-title{font-family:var(--font-display);font-size:18px;font-weight:600;margin-bottom:6px}
.diary-meta{display:flex;gap:10px;font-size:12px;color:var(--text-dim);flex-wrap:wrap}
.diary-meta span{display:flex;align-items:center;gap:3px}
.diary-story{font-size:13px;color:var(--text-dim);line-height:1.6;margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.diary-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.diary-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--text-dim)}
.month-header{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--text-dim);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.month-header:first-child{margin-top:0}
.route-compact{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.route-compact:active{opacity:.8}
.route-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.route-info{flex:1;min-width:0}
.route-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-meta-compact{font-size:11px;color:var(--text-dim);margin-top:2px}
.route-eye{width:32px;height:32px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.route-eye.hidden-route{opacity:.3}
.route-eye:active{border-color:var(--gold)}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-pill{font-size:11px;padding:5px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;transition:all .15s}
.filter-pill.active{background:var(--gold);color:#1a1a0e;border-color:var(--gold)}
.sort-row{display:flex;gap:8px;margin-bottom:12px}
.sort-btn{font-size:11px;padding:5px 10px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--text-dim);cursor:pointer}
.sort-btn.active{border-color:var(--gold);color:var(--text)}
.route-detail-header{padding:20px;border-bottom:1px solid var(--border)}
.route-detail-title{font-family:var(--font-display);font-size:26px;font-weight:600;margin-bottom:4px}
.route-detail-meta{font-size:12px;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap}
.pin-list-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.pin-icon{font-size:24px;flex-shrink:0}
.pin-info{flex:1}
.pin-note{font-size:14px;line-height:1.5}
.pin-time{font-size:11px;color:var(--text-dim);margin-top:2px}
.pin-photo{width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0}
.city-item{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);gap:12px}
.city-item-name{flex:1;font-size:16px;cursor:pointer}
.city-item-count{font-size:12px;color:var(--text-dim)}
.city-active-dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.city-delete{width:28px;height:28px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--red);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 30px;text-align:center;gap:12px}
.empty-icon{font-size:48px;opacity:.4}
.empty-text{color:var(--text-dim);font-size:14px;line-height:1.6}
#toast{position:absolute;bottom:calc(100px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);z-index:900;background:var(--surface2);border:1px solid var(--border);border-radius:24px;padding:10px 20px;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pin-marker{width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.3);box-shadow:0 2px 8px rgba(0,0,0,.4);font-size:16px}
.pin-inner{transform:rotate(45deg)}
.import-area{border:2px dashed var(--border);border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:16px}
.import-area:active{border-color:var(--gold)}
.import-area-icon{font-size:32px;margin-bottom:8px}
.import-area-text{font-size:14px;color:var(--text-dim)}
.photo-preview{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-bottom:8px;display:none}
.color-row{display:flex;gap:10px;margin-top:4px}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.color-dot.selected{border-color:var(--text)}
.theme-row{display:flex;gap:10px;margin-top:4px}
.theme-swatch{flex:1;padding:12px 8px;border-radius:12px;border:1.5px solid var(--border);cursor:pointer;text-align:center;font-size:11px;font-weight:500}
.theme-swatch.selected{border-color:var(--gold)}
.theme-swatch-dot{width:20px;height:20px;border-radius:50%;margin:0 auto 6px}
.lang-toggle{display:flex;background:var(--bg);border-radius:20px;border:1px solid var(--border);overflow:hidden}
.lang-btn{flex:1;padding:8px 12px;border:none;background:transparent;color:var(--text-dim);font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer}
.lang-btn.active{background:var(--gold);color:#1a1a0e;font-weight:600}
.achievement-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ach-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.ach-card.unlocked{border-color:var(--gold);background:rgba(201,169,110,.08)}
.ach-card.locked{opacity:.45}
.ach-icon{font-size:32px;margin-bottom:6px}
.ach-name{font-family:var(--font-display);font-size:14px;font-weight:600;margin-bottom:3px}
.ach-desc{font-size:11px;color:var(--text-dim);line-height:1.4}
.ach-date{font-size:10px;color:var(--gold);margin-top:4px}
#ach-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);z-index:999;background:var(--surface);border:2px solid var(--gold);border-radius:24px;padding:32px 28px;text-align:center;width:280px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#ach-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:all}
#ach-popup-icon{font-size:52px;margin-bottom:10px}
#ach-popup-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
#ach-popup-name{font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:6px}
#ach-popup-desc{font-size:13px;color:var(--text-dim);line-height:1.5}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.stat-value{font-family:var(--font-display);font-size:28px;font-weight:600;color:var(--gold)}
.stat-label{font-size:11px;color:var(--text-dim);margin-top:3px}
.search-bar{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:var(--font-body);font-size:14px;outline:none;margin-bottom:12px}
.search-bar:focus{border-color:var(--gold)}
.photo-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.photo-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.photo-info{flex:1;min-width:0}
.photo-info-title{font-size:13px;font-weight:500}
.photo-info-sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.section-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin:20px 0 10px;padding-bottom:6px;border-top:1px solid var(--border);padding-top:14px}
.replay-bar{position:absolute;bottom:calc(88px + var(--safe-bottom));left:16px;right:16px;z-index:500;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 16px;display:none;align-items:center;gap:10px;backdrop-filter:blur(12px)}
.replay-bar.show{display:flex}
.replay-progress{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.replay-fill{height:100%;background:var(--gold);transition:width .1s linear}
.replay-close{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;padding:0 4px}
.replay-speed{background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:11px;padding:4px 8px;cursor:pointer;white-space:nowrap}
.storage-bar{width:100%;height:6px;background:var(--border);border-radius:3px;margin-top:6px;overflow:hidden}
.storage-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .3s}
.storage-text{font-size:11px;color:var(--text-dim);margin-top:4px}
.custom-tag-row{display:flex;gap:8px;margin-top:8px}
.custom-tag-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:6px 10px;color:var(--text);font-size:13px;outline:none}
.custom-tag-add{background:var(--gold);border:none;color:#1a1a0e;border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div id="map"></div>
<div id="topbar">
  <div id="city-pill" onclick="openCityManager()"><div class="dot"></div><span id="city-name-display">选择城市</span></div>
  <div id="top-actions"><button class="top-btn" onclick="openImportSheet()">＋</button><button class="top-btn" onclick="openSettingsSheet()">⚙</button></div>
</div>
<button id="heatmap-btn" onclick="toggleHeatmap()">🔥</button>
<button id="locate-btn" onclick="locateMe()">◎</button>
<button id="fab" onclick="startPinMode()">📍</button>
<div id="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('map')" id="nav-map">地图</button>
  <button class="nav-btn" onclick="switchTab('diary')" id="nav-diary">日记</button>
  <button class="nav-btn" onclick="switchTab('routes')" id="nav-routes">路线</button>
  <button class="nav-btn" onclick="switchTab('achievements')" id="nav-achievements">成就</button>
</div>
<div class="replay-bar" id="replay-bar"><span id="replay-label" style="font-size:12px">回放中</span><div class="replay-progress"><div class="replay-fill" id="replay-fill"></div></div><button class="replay-speed" id="replay-speed-btn" onclick="cycleReplaySpeed()">1x</button><button class="replay-close" onclick="stopReplay()">✕</button></div>

<div class="panel" id="panel-diary">
  <div class="panel-header"><div class="panel-title" id="title-diary">探城日记</div></div>
  <div class="panel-body"><input class="search-bar" id="search-diary" placeholder="搜索…" oninput="renderDiary()"/><div id="diary-list"></div></div>
</div>
<div class="panel" id="panel-routes">
  <div class="panel-header"><div class="panel-title" id="title-routes">全部路线</div></div>
  <div class="panel-body"><input class="search-bar" id="search-routes" placeholder="搜索…" oninput="renderRoutes()"/><div id="routes-filter-row" class="filter-row"></div><div id="routes-sort-row" class="sort-row"></div><div id="routes-list"></div></div>
</div>
<div class="panel" id="panel-achievements">
  <div class="panel-header"><div class="panel-title" id="title-achievements">探索成就</div></div>
  <div class="panel-body"><div class="stats-grid" id="stats-grid"></div><div class="achievement-grid" id="achievement-grid"></div><div class="section-title" id="photos-section-title">照片墙</div><div id="photos-body"></div></div>
</div>
<div class="panel" id="panel-route-detail">
  <div class="panel-header"><button class="panel-back" onclick="closeRouteDetail()">←</button><div class="panel-title" id="route-detail-title"></div></div>
  <div class="panel-body" id="route-detail-body"></div>
</div>

// ── IndexedDB ──
const DBNAME='withme-photos';let photoDB=null;
function openPhotoDB(){return new Promise((res,rej)=>{if(photoDB)return res(photoDB);const req=indexedDB.open(DBNAME,1);req.onupgradeneeded=e=>e.target.result.createObjectStore('photos');req.onsuccess=e=>{photoDB=e.target.result;res(photoDB)};req.onerror=()=>rej()})}
async function savePhotoDb(id,data){const db=await openPhotoDB();return new Promise(res=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(data,id);tx.oncomplete=()=>res()})}
async function getPhoto(id){const db=await openPhotoDB();return new Promise(res=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').get(id);req.onsuccess=()=>res(req.result||null);req.onerror=()=>res(null)})}
async function deletePhoto(id){const db=await openPhotoDB();return new Promise(res=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>res()})}
async function getAllPhotos(){const db=await openPhotoDB();return new Promise(res=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').getAll();const reqK=tx.objectStore('photos').getAllKeys();let v,k;req.onsuccess=()=>v=req.result;reqK.onsuccess=()=>k=reqK.result;tx.oncomplete=()=>{const r={};(k||[]).forEach((x,i)=>r[x]=v[i]);res(r)}})}

// ── Photo compression ──
function compressPhoto(dataUrl,maxSz=1200,q=0.8){return new Promise(res=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxSz||h>maxSz){if(w>h){h=h*maxSz/w;w=maxSz}else{w=w*maxSz/h;h=maxSz}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))};img.src=dataUrl})}

function saveData(d){localStorage.setItem('withme_data',JSON.stringify(d))}
function getPrefs(){try{return JSON.parse(localStorage.getItem('withme_prefs')||'{}');}catch{return{}}}
function savePrefs(p){localStorage.setItem('withme_prefs',JSON.stringify(p))}
async function updateStorageInfo(){
  if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();const pct=((e.usage||0)/(e.quota||1)*100).toFixed(1);const mb=((e.usage||0)/1024/1024).toFixed(1);document.getElementById('storage-fill').style.width=pct+'%';document.getElementById('storage-text').textContent=mb+' MB / '+((e.quota||0)/1024/1024).toFixed(0)+' MB ('+pct+'%)'}
  else{document.getElementById('storage-text').textContent='浏览器不支持查询'}
}

async function migratePhotos(){const d=getData();let ch=false;for(const pin of d.pins){if(pin.photo&&!pin.hasPhoto){await savePhotoDb(pin.id,pin.photo);delete pin.photo;pin.hasPhoto=true;ch=true}}if(ch)saveData(d)}

// ── Map ──
function initMap(){map=L.map('map',{zoomControl:false,attributionControl:true}).setView([30.57,104.07],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:19}).addTo(map);L.control.zoom({position:'bottomright'}).addTo(map);map.on('click',onMapClick)}
function loadMapData(){const d=getData();document.getElementById('city-name-display').textContent=d.activeCity||t('selectCity');const hidden=d.hiddenRoutes||[];d.routes.filter(r=>r.city===d.activeCity&&!hidden.includes(r.id)).forEach(drawRoute);d.pins.filter(p=>p.city===d.activeCity).forEach(drawPin)}
function clearMapLayers(){map.eachLayer(l=>{if(l instanceof L.Polyline||l instanceof L.CircleMarker||l instanceof L.Marker)map.removeLayer(l)})}

let pinMode=false;
function startPinMode(){if(!getData().activeCity){toast(t('selectCityFirst'));return}pinMode=true;document.getElementById('fab').textContent='✕';document.getElementById('fab').onclick=cancelPinMode;toast(t('tapMapPin'))}
function cancelPinMode(){pinMode=false;relocatingPin=false;document.getElementById('fab').textContent='📍';document.getElementById('fab').onclick=startPinMode}
function onMapClick(e){
  if(relocatingPin){pendingPinLatLng=e.latlng;toast(t('located'));return}
  if(!pinMode)return;pendingPinLatLng=e.latlng;cancelPinMode();editingPinId=null;document.getElementById('sheet-pin-title').textContent=t('newPin');document.getElementById('btn-save-pin').textContent=t('savePin');document.getElementById('pin-location-hint').style.display='none';openSheet('sheet-pin');
}
function locateMe(){if(!navigator.geolocation){toast(t('locateFail'));return}toast(t('locating'));navigator.geolocation.getCurrentPosition(p=>{const{latitude:la,longitude:lo}=p.coords;map.setView([la,lo],17);if(locateMarker)map.removeLayer(locateMarker);locateMarker=L.circleMarker([la,lo],{radius:8,color:'#4A90D9',fillColor:'#4A90D9',fillOpacity:.9,weight:3}).addTo(map);toast(t('located'))},()=>toast(t('locateFail')),{enableHighAccuracy:true,timeout:10000})}
function drawRoute(r){if(!r.coords||!r.coords.length)return;const c=r.color||'#C9A96E';const pl=L.polyline(r.coords,{color:c,weight:3,opacity:.85}).addTo(map);pl.on('click',()=>openRouteDetail(r.id));L.circleMarker(r.coords[0],{radius:5,color:c,fillColor:c,fillOpacity:1,weight:2}).addTo(map);L.circleMarker(r.coords[r.coords.length-1],{radius:7,color:c,fillColor:'#1C3829',fillOpacity:1,weight:2}).addTo(map)}
function drawPin(pin){const ic=L.divIcon({html:'<div class="pin-marker" style="background:'+(pin.color||'#1C3829')+'"><span class="pin-inner">'+(pin.emoji||'📍')+'</span></div>',className:'',iconSize:[36,36],iconAnchor:[18,36]});L.marker([pin.lat,pin.lng],{icon:ic}).addTo(map).on('click',()=>openPinDetail(pin.id))}

// ── Parse ──
function parseGPX(t){const x=new DOMParser().parseFromString(t,'application/xml');const c=[];x.querySelectorAll('trkpt').forEach(p=>{const la=parseFloat(p.getAttribute('lat')),lo=parseFloat(p.getAttribute('lon'));if(!isNaN(la)&&!isNaN(lo))c.push([la,lo])});return c}
function parseKML(t){const x=new DOMParser().parseFromString(t,'application/xml');const c=[];x.querySelectorAll('coordinates').forEach(el=>{el.textContent.trim().split(/\s+/).forEach(s=>{const[lo,la]=s.split(',').map(Number);if(!isNaN(la)&&!isNaN(lo))c.push([la,lo])})});return c}
function handleTrackFile(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const txt=e.target.result;pendingGPXData=f.name.endsWith('.kml')?parseKML(txt):parseGPX(txt);if(pendingGPXData.length>0){toast('✓ '+pendingGPXData.length+' '+t('trackPoints'));document.getElementById('route-name').value=f.name.replace(/\.(gpx|kml)$/i,'').replace(/_/g,' ')}else toast('No track data')};r.readAsText(f)}
async function handlePinPhoto(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=async e=>{pendingPinPhoto=await compressPhoto(e.target.result);const p=document.getElementById('pin-photo-preview');p.src=pendingPinPhoto;p.style.display='block'};r.readAsDataURL(f)}

// ── Save ──
async function savePin(){
  const d=getData();const note=document.getElementById('pin-note').value.trim();
  if(editingPinId){const pin=d.pins.find(p=>p.id===editingPinId);if(!pin){closePinSheet();return}
    pin.emoji=selectedEmoji;pin.note=note;if(pendingPinLatLng){pin.lat=pendingPinLatLng.lat;pin.lng=pendingPinLatLng.lng}
    if(pendingPinPhoto){await savePhotoDb(pin.id,pendingPinPhoto);pin.hasPhoto=true}
    saveData(d);clearMapLayers();loadMapData();closePinSheet();resetPinForm();toast(t('pinUpdated'));
  }else{if(!pendingPinLatLng){closePinSheet();return}
    const pin={id:Date.now().toString(),city:d.activeCity,lat:pendingPinLatLng.lat,lng:pendingPinLatLng.lng,emoji:selectedEmoji,note,hasPhoto:!!pendingPinPhoto,time:new Date().toISOString()};
    if(pendingPinPhoto)await savePhotoDb(pin.id,pendingPinPhoto);
    d.pins.push(pin);saveData(d);drawPin(pin);closePinSheet();resetPinForm();toast(t('pinSaved')+' '+selectedEmoji);
  }checkAchievements(true);updateStorageInfo();
}
function closePinSheet(){relocatingPin=false;closeSheet('sheet-pin')}
function saveRoute(){
  const name=document.getElementById('route-name').value.trim();if(!name){toast(t('enterRouteName'));return}
  const d=getData();
  if(editingRouteId){const r=d.routes.find(x=>x.id===editingRouteId);if(!r){closeSheet('sheet-import');return}
    r.name=name;r.story=document.getElementById('route-story').value.trim();r.mood=selectedMood;r.weather=selectedWeather;r.tags=selectedTags.slice();r.color=selectedRouteColor;
    if(pendingGPXData&&pendingGPXData.length)r.coords=pendingGPXData,r.km=calcDist(pendingGPXData);
    saveData(d);clearMapLayers();loadMapData();closeSheet('sheet-import');resetImportForm();toast(t('routeUpdated'));
  }else{const r={id:Date.now().toString(),city:d.activeCity,name,story:document.getElementById('route-story').value.trim(),mood:selectedMood,weather:selectedWeather,tags:selectedTags.slice(),color:selectedRouteColor,coords:pendingGPXData||[],date:new Date().toISOString()};
    if(pendingGPXData&&pendingGPXData.length)r.km=calcDist(pendingGPXData);
    d.routes.push(r);saveData(d);drawRoute(r);if(r.coords.length)map.fitBounds(L.polyline(r.coords).getBounds(),{padding:[40,40]});
    closeSheet('sheet-import');resetImportForm();toast(t('routeSaved'));
  }checkAchievements(true);
}
function calcDist(c){let t=0;for(let i=1;i<c.length;i++)t+=L.latLng(c[i-1]).distanceTo(L.latLng(c[i]));return(t/1000).toFixed(1)}

// ── Cities ──
function openCityManager(){renderCityList();openSheet('sheet-city')}
function renderCityList(){const d=getData(),el=document.getElementById('city-list');if(!d.cities.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">🏙</div><div class="empty-text">'+t('emptyCity')+'</div></div>';return}el.innerHTML=d.cities.map(c=>{const cnt=d.routes.filter(r=>r.city===c).length,isA=d.activeCity===c;return'<div class="city-item">'+(isA?'<div class="city-active-dot"></div>':'<div style="width:8px"></div>')+'<div class="city-item-name" onclick="selectCity(\''+c+'\')">'+c+'</div><div class="city-item-count">'+cnt+'</div><button class="city-delete" onclick="deleteCity(\''+c+'\')">✕</button></div>'}).join('')}
function selectCity(n){const d=getData();d.activeCity=n;saveData(d);document.getElementById('city-name-display').textContent=n;clearMapLayers();loadMapData();geocodeCity(n);renderCityList();closeSheet('sheet-city');toast(t('switchedTo')+' '+n);checkAchievements(true)}
function addCity(){const n=document.getElementById('new-city-input').value.trim();if(!n)return;const d=getData();if(d.cities.includes(n)){toast(t('cityExists'));return}d.cities.push(n);if(!d.activeCity)d.activeCity=n;saveData(d);document.getElementById('new-city-input').value='';document.getElementById('city-name-display').textContent=d.activeCity;if(d.activeCity===n)geocodeCity(n);renderCityList();toast(t('cityAdded')+' '+n);checkAchievements(true)}
function deleteCity(n){if(!confirm(t('confirmDeleteCity')))return;const d=getData();d.pins.filter(p=>p.city===n).forEach(p=>{if(p.hasPhoto)deletePhoto(p.id)});d.pins=d.pins.filter(p=>p.city!==n);d.routes=d.routes.filter(r=>r.city!==n);d.cities=d.cities.filter(c=>c!==n);if(d.activeCity===n)d.activeCity=d.cities[0]||null;saveData(d);document.getElementById('city-name-display').textContent=d.activeCity||t('selectCity');clearMapLayers();loadMapData();renderCityList();toast(t('cityDeleted'))}
function geocodeCity(n){fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(n)+'&limit=1').then(r=>r.json()).then(d=>{if(d.length)map.setView([parseFloat(d[0].lat),parseFloat(d[0].lon)],13)}).catch(()=>{})}

// ── Diary (by month) ──
function renderDiary(){
  const d=getData(),el=document.getElementById('diary-list');const q=(document.getElementById('search-diary').value||'').toLowerCase();
  let routes=d.routes.filter(r=>r.city===d.activeCity).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(q)routes=routes.filter(r=>(r.name+' '+(r.story||'')+' '+(r.tags||[]).join(' ')+' '+(r.emoji||'')).toLowerCase().includes(q));
  if(!routes.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">📖</div><div class="empty-text">'+t('emptyDiary')+'</div></div>';return}
  const grouped={};routes.forEach(r=>{const d=new Date(r.date);const key=d.getFullYear()+'-'+(d.getMonth()+1);if(!grouped[key])grouped[key]=[];grouped[key].push(r)});
  let html='';Object.entries(grouped).forEach(([key,rs])=>{const[y,m]=key.split('-');const label=currentLang==='zh'?y+'年'+m+'月':new Date(y,m-1).toLocaleDateString('en-US',{year:'numeric',month:'long'});
    html+='<div class="month-header">'+label+' · '+rs.length+(currentLang==='zh'?'次出行':' walks')+'</div>';
    rs.forEach(r=>{const date=new Date(r.date);const ds=currentLang==='zh'?(date.getMonth()+1)+'月'+date.getDate()+'日':date.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const tagH=(r.tags||[]).map(tg=>'<span class="diary-tag">'+tg+'</span>').join('');
      html+='<div class="diary-card" onclick="openRouteDetail(\''+r.id+'\')"><div class="diary-date">'+ds+(r.weather?' '+r.weather:'')+'</div><div class="diary-title">'+(r.mood||'')+' '+r.name+'</div>'+(r.story?'<div class="diary-story">'+r.story+'</div>':'')+(tagH?'<div class="diary-tags">'+tagH+'</div>':'')+'<div class="diary-meta">'+(r.km?'<span>🚶 '+r.km+' km</span>':'')+'</div></div>'})});
  el.innerHTML=html;
}

// ── Routes (compact + filter + sort) ──
function renderRoutes(){
  const d=getData(),el=document.getElementById('routes-list');const q=(document.getElementById('search-routes').value||'').toLowerCase();
  const hidden=d.hiddenRoutes||[];
  let routes=d.routes.filter(r=>r.city===d.activeCity);
  if(q)routes=routes.filter(r=>(r.name+' '+(r.story||'')+' '+(r.tags||[]).join(' ')).toLowerCase().includes(q));
  const allTags=new Set();routes.forEach(r=>(r.tags||[]).forEach(tg=>allTags.add(tg)));
  document.getElementById('routes-filter-row').innerHTML='<div class="filter-pill'+(routeFilter==='all'?' active':'')+'" onclick="setRouteFilter(\'all\')">'+t('all')+'</div>'+[...allTags].map(tg=>'<div class="filter-pill'+(routeFilter===tg?' active':'')+'" onclick="setRouteFilter(\''+tg+'\')">'+tg+'</div>').join('');
  document.getElementById('routes-sort-row').innerHTML='<div class="sort-btn'+(routeSort==='date'?' active':'')+'" onclick="setRouteSort(\'date\')">'+t('sortDate')+'</div><div class="sort-btn'+(routeSort==='dist'?' active':'')+'" onclick="setRouteSort(\'dist\')">'+t('sortDist')+'</div>';
  if(routeFilter!=='all')routes=routes.filter(r=>(r.tags||[]).includes(routeFilter));
  if(routeSort==='date')routes.sort((a,b)=>new Date(b.date)-new Date(a.date));
  else routes.sort((a,b)=>(parseFloat(b.km)||0)-(parseFloat(a.km)||0));
  if(!routes.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">🗺</div><div class="empty-text">'+t('emptyRoutes')+'</div></div>';return}
  el.innerHTML=routes.map(r=>{const ds=(new Date(r.date).getMonth()+1)+'/'+(new Date(r.date).getDate());const isHidden=hidden.includes(r.id);
    return'<div class="route-compact"><div class="route-dot" style="background:'+(r.color||'#C9A96E')+'"></div><div class="route-info" onclick="openRouteDetail(\''+r.id+'\')"><div class="route-name">'+r.name+'</div><div class="route-meta-compact">'+ds+' · '+(r.km||'?')+' km'+(r.tags&&r.tags.length?' · '+r.tags[0]:'')+'</div></div><button class="route-eye'+(isHidden?' hidden-route':'')+'" onclick="toggleRouteVis(\''+r.id+'\')">'+(isHidden?'◻':'◼')+'</button></div>'}).join('');
}
function setRouteFilter(f){routeFilter=f;renderRoutes()}
function setRouteSort(s){routeSort=s;renderRoutes()}
function toggleRouteVis(id){const d=getData();if(!d.hiddenRoutes)d.hiddenRoutes=[];if(d.hiddenRoutes.includes(id))d.hiddenRoutes=d.hiddenRoutes.filter(x=>x!==id);else d.hiddenRoutes.push(id);saveData(d);clearMapLayers();loadMapData();renderRoutes()}

// ── Route Detail ──
function openRouteDetail(id){
  const d=getData(),r=d.routes.find(x=>x.id===id);if(!r)return;
  document.getElementById('route-detail-title').textContent=r.name;
  const date=new Date(r.date),ds=currentLang==='zh'?date.getFullYear()+'年'+(date.getMonth()+1)+'月'+date.getDate()+'日':date.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const nearPins=d.pins.filter(p=>p.city===r.city&&isNearRoute(p,r));
  const tagH=(r.tags||[]).map(tg=>'<span class="diary-tag">'+tg+'</span>').join('');
  let pinHtml=nearPins.length?nearPins.map(p=>'<div class="pin-list-item"><div class="pin-icon">'+(p.emoji||'📍')+'</div><div class="pin-info">'+(p.note?'<div class="pin-note">'+p.note+'</div>':'<div class="pin-note" style="color:var(--text-dim)">'+t('noNote')+'</div>')+'<div class="pin-time">'+new Date(p.time).toLocaleDateString()+'</div></div>'+(p.hasPhoto?'<img class="pin-photo" data-pin-id="'+p.id+'" onclick="viewPinPhoto(\''+p.id+'\')"/>':'')+'</div>').join(''):'<div style="color:var(--text-dim);font-size:14px">'+t('noPins')+'</div>';
  document.getElementById('route-detail-body').innerHTML=
    '<div class="route-detail-header"><div class="route-detail-title">'+(r.mood||'')+' '+r.name+'</div><div class="route-detail-meta"><span>'+ds+'</span>'+(r.km?'<span>🚶 '+r.km+' km</span>':'')+(r.weather?'<span>'+r.weather+'</span>':'')+'</div>'+(tagH?'<div class="diary-tags" style="margin-top:8px">'+tagH+'</div>':'')+'</div>'+
    (r.story?'<div style="padding:16px 20px;font-size:14px;line-height:1.8;color:var(--text-dim);border-bottom:1px solid var(--border)">'+r.story+'</div>':'')+
    '<div style="padding:16px 20px"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:12px">'+(currentLang==='zh'?'标记点':'Pins')+'</div>'+pinHtml+'</div>'+
    '<div style="padding:0 20px 20px"><button class="btn-secondary" onclick="editRoute(\''+r.id+'\')">✏️ '+t('editBtn')+'</button><button class="btn-secondary" onclick="flyToRoute(\''+r.id+'\')">'+t('viewOnMap')+'</button>'+(r.coords.length>1?'<button class="btn-secondary" onclick="startReplay(\''+r.id+'\')">▶ '+t('replay')+'</button>':'')+'<button class="btn-secondary" onclick="openPostcard(\''+r.id+'\')">🏞 '+t('postcard')+'</button><button class="btn-danger" onclick="deleteRoute(\''+r.id+'\')">'+t('deleteRoute')+'</button></div>';
  document.getElementById('panel-route-detail').classList.add('open');
  nearPins.filter(p=>p.hasPhoto).forEach(p=>{getPhoto(p.id).then(data=>{const img=document.querySelector('[data-pin-id="'+p.id+'"]');if(img&&data)img.src=data})});
}
function isNearRoute(pin,route){if(!route.coords||!route.coords.length)return true;const pll=L.latLng(pin.lat,pin.lng);for(let i=0;i<route.coords.length;i+=Math.max(1,Math.floor(route.coords.length/50))){if(pll.distanceTo(L.latLng(route.coords[i]))<500)return true}return false}
function closeRouteDetail(){document.getElementById('panel-route-detail').classList.remove('open')}
function flyToRoute(id){const r=getData().routes.find(x=>x.id===id);if(r&&r.coords.length){closeRouteDetail();switchTab('map');map.fitBounds(L.polyline(r.coords).getBounds(),{padding:[40,40]})}}
function deleteRoute(id){if(!confirm(t('confirmDelete')))return;const d=getData();d.routes=d.routes.filter(r=>r.id!==id);saveData(d);closeRouteDetail();clearMapLayers();loadMapData();toast(t('routeDeleted'))}
function editRoute(id){const d=getData(),r=d.routes.find(x=>x.id===id);if(!r)return;editingRouteId=id;closeRouteDetail();document.getElementById('sheet-import-title').textContent=t('editRoute');document.getElementById('btn-save-route').textContent=t('updateRoute');document.getElementById('gpx-import-area').style.display=r.coords.length?'none':'block';document.getElementById('route-name').value=r.name;document.getElementById('route-story').value=r.story||'';selectedMood=r.mood||'😊';selectedWeather=r.weather||'';selectedTags=r.tags?r.tags.slice():[];selectedRouteColor=r.color||'#C9A96E';buildMoodGrid();buildWeatherGrid();buildTagGrid();buildColorRow();openSheet('sheet-import')}

// ── Pin Detail ──
async function openPinDetail(id){const d=getData(),pin=d.pins.find(p=>p.id===id);if(!pin)return;let ph='';if(pin.hasPhoto){const data=await getPhoto(id);if(data)ph='<img src="'+data+'" style="width:100%;border-radius:12px;margin-bottom:16px"/>';}
  document.getElementById('pin-detail-title').textContent=pin.emoji+' '+(currentLang==='zh'?'标记':'Pin');
  document.getElementById('pin-detail-body').innerHTML='<div style="font-size:15px;line-height:1.7;margin-bottom:16px">'+(pin.note||'<span style="color:var(--text-dim)">'+t('noNote')+'</span>')+'</div>'+ph+'<div style="font-size:12px;color:var(--text-dim);margin-bottom:20px">'+new Date(pin.time).toLocaleString()+'</div><button class="btn-secondary" onclick="editPin(\''+pin.id+'\')">✏️ '+t('editBtn')+'</button><button class="btn-danger" onclick="deletePin(\''+pin.id+'\')">'+t('deletePin')+'</button><button class="btn-secondary" onclick="closeSheet(\'sheet-pin-detail\')">'+t('close')+'</button>';
  openSheet('sheet-pin-detail')}
async function editPin(id){const d=getData(),pin=d.pins.find(p=>p.id===id);if(!pin)return;editingPinId=id;pendingPinLatLng={lat:pin.lat,lng:pin.lng};closeSheet('sheet-pin-detail');document.getElementById('sheet-pin-title').textContent=t('editPin');document.getElementById('btn-save-pin').textContent=t('savePin');document.getElementById('pin-note').value=pin.note||'';selectedEmoji=pin.emoji||'📍';buildEmojiGrid();document.getElementById('pin-location-hint').style.display='block';document.getElementById('pin-location-hint').textContent=t('relocateHint');relocatingPin=true;if(pin.hasPhoto){const data=await getPhoto(id);if(data){const p=document.getElementById('pin-photo-preview');p.src=data;p.style.display='block'}}openSheet('sheet-pin')}
function deletePin(id){const d=getData(),pin=d.pins.find(p=>p.id===id);if(pin&&pin.hasPhoto)deletePhoto(id);d.pins=d.pins.filter(p=>p.id!==id);saveData(d);closeSheet('sheet-pin-detail');clearMapLayers();loadMapData();toast(t('pinDeleted'))}
async function viewPinPhoto(id){const data=await getPhoto(id);if(data){document.getElementById('photo-view-img').src=data;openSheet('sheet-photo-view')}}

// ── Photos in Achievements ──
async function renderPhotos(){
  const d=getData(),body=document.getElementById('photos-body');
  const pins=d.pins.filter(p=>p.hasPhoto&&p.city===d.activeCity);

// ── Heatmap ──
function toggleHeatmap(){heatmapOn=!heatmapOn;document.getElementById('heatmap-btn').classList.toggle('active-heat',heatmapOn);if(heatmapOn){const d=getData();d.routes.filter(r=>r.city===d.activeCity).forEach(r=>{if(!r.coords)return;for(let i=0;i<r.coords.length;i+=Math.max(1,Math.floor(r.coords.length/100))){heatCircles.push(L.circleMarker(r.coords[i],{radius:12,color:'transparent',fillColor:'#C9A96E',fillOpacity:.15,weight:0}).addTo(map))}});d.pins.filter(p=>p.city===d.activeCity).forEach(p=>{heatCircles.push(L.circleMarker([p.lat,p.lng],{radius:20,color:'transparent',fillColor:'#C97E7E',fillOpacity:.2,weight:0}).addTo(map))});toast(t('heatmapOn'))}else{heatCircles.forEach(c=>map.removeLayer(c));heatCircles=[];toast(t('heatmapOff'))}}

// ── Replay with speed ──
function startReplay(id){const r=getData().routes.find(x=>x.id===id);if(!r||!r.coords.length)return;closeRouteDetail();switchTab('map');map.fitBounds(L.polyline(r.coords).getBounds(),{padding:[40,40]});document.getElementById('replay-bar').classList.add('show');document.getElementById('replay-label').textContent=t('replayLabel');replaySpeedIdx=2;document.getElementById('replay-speed-btn').textContent=REPLAY_SPEEDS[replaySpeedIdx]+'x';let i=0;const total=r.coords.length;replayMarker=L.circleMarker(r.coords[0],{radius:8,color:r.color||'#C9A96E',fillColor:r.color||'#C9A96E',fillOpacity:1,weight:2}).addTo(map);function step(){if(i>=total){stopReplay();return}replayMarker.setLatLng(r.coords[i]);document.getElementById('replay-fill').style.width=(i/total*100)+'%';i++;replayTimer=setTimeout(step,80/REPLAY_SPEEDS[replaySpeedIdx])}step()}
function cycleReplaySpeed(){replaySpeedIdx=(replaySpeedIdx+1)%REPLAY_SPEEDS.length;document.getElementById('replay-speed-btn').textContent=REPLAY_SPEEDS[replaySpeedIdx]+'x'}
function stopReplay(){if(replayTimer){clearTimeout(replayTimer);replayTimer=null}if(replayMarker){map.removeLayer(replayMarker);replayMarker=null}document.getElementById('replay-bar').classList.remove('show')}

// ── Postcard ──
function openPostcard(id){const d=getData(),r=d.routes.find(x=>x.id===id);if(!r)return;postcardRouteData=r;closeRouteDetail();const date=new Date(r.date),ds=currentLang==='zh'?date.getFullYear()+'年'+(date.getMonth()+1)+'月'+date.getDate()+'日':date.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('pc-name').textContent=(r.mood||'')+' '+r.name;document.getElementById('pc-date').textContent=ds+(r.weather?' '+r.weather:'');
  document.getElementById('pc-story').textContent=(r.story||'').slice(0,120);document.getElementById('pc-meta').innerHTML=(r.km?'<span>🚶 '+r.km+' km</span>':'');
  document.getElementById('pc-sig').textContent=getPrefs().signature?'— '+getPrefs().signature:'';
  document.getElementById('pc-custom-text').value='';document.getElementById('pc-show-story').checked=true;document.getElementById('pc-show-meta').checked=true;
  drawPostcardCanvas(r);openSheet('sheet-postcard')}
function updatePostcardText(){if(!postcardRouteData)return;const r=postcardRouteData;const custom=document.getElementById('pc-custom-text').value;
  document.getElementById('pc-name').textContent=custom||(r.mood||'')+' '+r.name;
  document.getElementById('pc-story').style.display=document.getElementById('pc-show-story').checked?'block':'none';
  document.getElementById('pc-meta').style.display=document.getElementById('pc-show-meta').checked?'flex':'none'}
function drawPostcardCanvas(r){const canvas=document.getElementById('postcard-canvas'),ctx=canvas.getContext('2d');canvas.width=600;canvas.height=300;ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--bg').trim()||'#0f1f18';ctx.fillRect(0,0,600,300);if(r.coords.length>1){const lats=r.coords.map(c=>c[0]),lons=r.coords.map(c=>c[1]),minLa=Math.min(...lats),maxLa=Math.max(...lats),minLo=Math.min(...lons),maxLo=Math.max(...lons),pad=30,w=540,h=240,scale=Math.min(w/(maxLo-minLo||1),h/(maxLa-minLa||1));ctx.strokeStyle=r.color||'#C9A96E';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.globalAlpha=.8;ctx.beginPath();r.coords.forEach((c,i)=>{const x=pad+(c[1]-minLo)*scale,y=pad+(maxLa-c[0])*scale;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=r.color||'#C9A96E';const s=r.coords[0],e=r.coords[r.coords.length-1];ctx.beginPath();ctx.arc(pad+(s[1]-minLo)*scale,pad+(maxLa-s[0])*scale,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(pad+(e[1]-minLo)*scale,pad+(maxLa-e[0])*scale,6,0,Math.PI*2);ctx.fill()}}
function savePostcard(){html2canvas(document.getElementById('postcard-inner'),{backgroundColor:null,scale:2}).then(c=>{const a=document.createElement('a');a.download='withme-postcard.png';a.href=c.toDataURL();a.click();toast(t('saveImage'))}).catch(()=>toast('Failed'))}

// ── Achievements ──
function checkAchievements(anim){const d=getData();if(!d.unlockedAch)d.unlockedAch=[];if(!d.achDates)d.achDates={};let news=[];ACHIEVEMENTS.forEach(a=>{if(!d.unlockedAch.includes(a.id)&&a.ck(d)){d.unlockedAch.push(a.id);d.achDates[a.id]=new Date().toISOString();news.push(a)}});if(news.length)saveData(d);if(anim&&news.length)showAchPopup(news[0])}
function showAchPopup(a){document.getElementById('ach-popup-icon').textContent=a.icon;document.getElementById('ach-popup-label').textContent=t('achUnlocked');document.getElementById('ach-popup-name').textContent=currentLang==='zh'?a.nz:a.ne;document.getElementById('ach-popup-desc').textContent=currentLang==='zh'?a.dz:a.de;document.getElementById('ach-popup').classList.add('show');setTimeout(()=>document.getElementById('ach-popup').classList.remove('show'),3500)}
async function renderAchievements(){const d=getData(),unl=d.unlockedAch||[],dates=d.achDates||{};const km=tkm(d).toFixed(1);
  document.getElementById('stats-grid').innerHTML='<div class="stat-card"><div class="stat-value">'+km+'</div><div class="stat-label">'+t('totalKm')+'</div></div><div class="stat-card"><div class="stat-value">'+d.routes.length+'</div><div class="stat-label">'+t('totalRoutes')+'</div></div><div class="stat-card"><div class="stat-value">'+d.pins.length+'</div><div class="stat-label">'+t('totalPins')+'</div></div><div class="stat-card"><div class="stat-value">'+d.cities.length+'</div><div class="stat-label">'+t('totalCities')+'</div></div>';
  document.getElementById('achievement-grid').innerHTML=ACHIEVEMENTS.map(a=>{const u=unl.includes(a.id);return'<div class="ach-card '+(u?'unlocked':'locked')+'"><div class="ach-icon">'+(u?a.icon:'🔒')+'</div><div class="ach-name">'+(currentLang==='zh'?a.nz:a.ne)+'</div><div class="ach-desc">'+(currentLang==='zh'?a.dz:a.de)+'</div>'+(u&&dates[a.id]?'<div class="ach-date">'+new Date(dates[a.id]).toLocaleDateString()+'</div>':'')+'</div>'}).join('');
  document.getElementById('photos-section-title').textContent=t('photoWall');
  await renderPhotos();
}

// ── Theme & Lang ──
function setTheme(th){currentTheme=th;applyTheme(th);const p=getPrefs();p.theme=th;savePrefs(p)}
function applyTheme(th){document.body.setAttribute('data-theme',th==='default'?'':th);['default','classic','journal'].forEach(t=>document.getElementById('swatch-'+t)?.classList.toggle('selected',t===th))}
function setLang(l){currentLang=l;applyLang(l);const p=getPrefs();p.lang=l;savePrefs(p)}
function applyLang(l){currentLang=l;const L=T[l];
  document.getElementById('lang-zh').classList.toggle('active',l==='zh');document.getElementById('lang-en').classList.toggle('active',l==='en');
  document.getElementById('nav-map').textContent=L.map;document.getElementById('nav-diary').textContent=L.diary;document.getElementById('nav-routes').textContent=L.routes;document.getElementById('nav-achievements').textContent=L.achievements;
  document.getElementById('city-name-display').textContent=getData().activeCity||L.selectCity;
  document.getElementById('title-diary').textContent=L.diary;document.getElementById('title-routes').textContent=L.routes;document.getElementById('title-achievements').textContent=L.achievements;
  document.getElementById('sheet-pin-title').textContent=editingPinId?L.editPin:L.newPin;document.getElementById('sheet-import-title').textContent=editingRouteId?L.editRoute:L.importRoute;
  document.getElementById('sheet-city-title').textContent=L.cityTitle;document.getElementById('sheet-settings-title').textContent=L.settings;document.getElementById('sheet-postcard-title').textContent=L.postcard;
  document.getElementById('lbl-icon').textContent=L.icon;document.getElementById('lbl-note').textContent=L.note;document.getElementById('lbl-photo').textContent=L.photo;
  document.getElementById('pin-note').placeholder=L.notePlaceholder;document.getElementById('btn-choose-photo').textContent=L.choosePhoto;
  document.getElementById('btn-save-pin').textContent=L.savePin;document.getElementById('btn-cancel-pin').textContent=L.cancel;
  document.getElementById('lbl-route-name').textContent=L.routeName;document.getElementById('lbl-story').textContent=L.story;document.getElementById('lbl-mood').textContent=L.mood;document.getElementById('lbl-weather').textContent=L.weather;document.getElementById('lbl-tags').textContent=L.tags;document.getElementById('lbl-color').textContent=L.color;
  document.getElementById('route-name').placeholder=L.routeNamePlaceholder;document.getElementById('route-story').placeholder=L.storyPlaceholder;
  document.getElementById('import-hint').innerHTML=L.importHint+'<br/><small>'+L.importSub+'</small>';
  document.getElementById('btn-save-route').textContent=editingRouteId?L.updateRoute:L.saveRoute;document.getElementById('btn-cancel-route').textContent=L.cancel;
  document.getElementById('lbl-new-city').textContent=L.addCity;document.getElementById('new-city-input').placeholder=L.cityPlaceholder;document.getElementById('btn-add-city').textContent=L.add;document.getElementById('btn-done-city').textContent=L.done;
  document.getElementById('lbl-lang').textContent=L.lang;document.getElementById('lbl-theme').textContent=L.theme;document.getElementById('lbl-backup').textContent=L.backup;document.getElementById('lbl-signature').textContent=L.signature;document.getElementById('signature-input').placeholder=L.sigPlaceholder;document.getElementById('lbl-storage').textContent=L.storage;
  document.getElementById('btn-export').textContent=L.exportBackup;document.getElementById('restore-hint').textContent=L.restoreHint;document.getElementById('btn-close-settings').textContent=L.closeSettings;
  document.getElementById('theme-name-default').textContent=L.themeDefault;document.getElementById('theme-name-classic').textContent=L.themeClassic;document.getElementById('theme-name-journal').textContent=L.themeJournal;
  document.getElementById('search-diary').placeholder=L.searchPlaceholder;document.getElementById('search-routes').placeholder=L.searchPlaceholder;
  document.getElementById('btn-save-postcard').textContent=L.saveImage;document.getElementById('ach-popup-label').textContent=L.achUnlocked;
  document.getElementById('custom-tag-input').placeholder=L.customTagPlaceholder;
  document.getElementById('pin-location-hint').textContent=L.relocateHint;
  buildTagGrid();
}
function saveSignature(){const p=getPrefs();p.signature=document.getElementById('signature-input').value;savePrefs(p)}

// ── Backup ──
async function exportBackup(){const d=getData();const photos=await getAllPhotos();d._photos=photos;const blob=new Blob([JSON.stringify(d)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='withme-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);delete d._photos;toast(t('backupExported'))}
async function importBackup(input){const f=input.files[0];if(!f)return;if(!confirm(t('confirmRestore')))return;const r=new FileReader();r.onload=async e=>{try{const data=JSON.parse(e.target.result);if(!data.routes||!data.pins)throw 0;if(data._photos){for(const[k,v]of Object.entries(data._photos))await savePhotoDb(k,v);delete data._photos}data.pins.forEach(p=>{if(p.photo){savePhotoDb(p.id,p.photo);p.hasPhoto=true;delete p.photo}});localStorage.setItem('withme_data',JSON.stringify(data));toast(t('backupRestored'))}catch{toast(t('backupInvalid'))}};r.readAsText(f)}

// ── Tabs ──
function switchTab(tab){
  closeRouteDetail();stopReplay();
  ['map','diary','routes','achievements'].forEach(id=>{document.getElementById('nav-'+id).classList.toggle('active',id===tab);if(id!=='map')document.getElementById('panel-'+id).classList.toggle('open',id===tab)});
  const isMap=tab==='map';document.getElementById('topbar').classList.toggle('hidden',!isMap);document.getElementById('fab').classList.toggle('hidden',!isMap);document.getElementById('locate-btn').classList.toggle('map-btn-hidden',!isMap);document.getElementById('heatmap-btn').classList.toggle('map-btn-hidden',!isMap);
  if(tab==='diary')renderDiary();if(tab==='routes')renderRoutes();if(tab==='achievements')renderAchievements();
}

// ── Sheets ──
function openSheet(id){document.getElementById(id).classList.add('open')}
function closeSheet(id){document.getElementById(id).classList.remove('open')}
function openImportSheet(){if(!getData().activeCity){toast(t('selectCityFirst'));return}editingRouteId=null;document.getElementById('sheet-import-title').textContent=t('importRoute');document.getElementById('btn-save-route').textContent=t('saveRoute');document.getElementById('gpx-import-area').style.display='block';openSheet('sheet-import')}
function openSettingsSheet(){updateStorageInfo();openSheet('sheet-settings')}
document.querySelectorAll('.sheet-overlay').forEach(o=>{o.addEventListener('click',e=>{if(e.target===o){if(o.id==='sheet-pin'){relocatingPin=false}o.classList.remove('open')}})});

// ── Tags ──
function buildTagGrid(){const d=getData();const presets=currentLang==='zh'?PRESET_TAGS_ZH:PRESET_TAGS_EN;const customs=d.customTags||[];const all=[...presets,...customs];
  document.getElementById('route-tag-grid').innerHTML=all.map(tg=>'<div class="tag-btn'+(selectedTags.includes(tg)?' selected':'')+'" onclick="toggleTag(this,\''+tg+'\')">'+tg+'</div>').join('')}
function toggleTag(el,tg){if(selectedTags.includes(tg)){selectedTags=selectedTags.filter(x=>x!==tg);el.classList.remove('selected')}else{selectedTags.push(tg);el.classList.add('selected')}}
function addCustomTag(){const input=document.getElementById('custom-tag-input');const tg=input.value.trim();if(!tg)return;const d=getData();if(!d.customTags)d.customTags=[];if(!d.customTags.includes(tg)){d.customTags.push(tg);saveData(d)}selectedTags.push(tg);input.value='';buildTagGrid()}

// ── Builders ──
function buildEmojiGrid(){document.getElementById('pin-emoji-grid').innerHTML=PIN_EMOJIS.map(e=>'<div class="emoji-btn'+(e===selectedEmoji?' selected':'')+'" onclick="selectEmoji(this,\''+e+'\')">'+e+'</div>').join('')}
function selectEmoji(el,e){document.querySelectorAll('.emoji-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');selectedEmoji=e}
function buildMoodGrid(){document.getElementById('route-mood-grid').innerHTML=MOODS.map(m=>'<div class="mood-btn'+(m===selectedMood?' selected':'')+'" onclick="selectMood(this,\''+m+'\')">'+m+'</div>').join('')}
function selectMood(el,m){document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');selectedMood=m}
function buildWeatherGrid(){document.getElementById('route-weather-grid').innerHTML=WEATHERS.map(w=>'<div class="weather-btn'+(w===selectedWeather?' selected':'')+'" onclick="selectWeather(this,\''+w+'\')">'+w+'</div>').join('')}
function selectWeather(el,w){document.querySelectorAll('.weather-btn').forEach(b=>b.classList.remove('selected'));if(selectedWeather===w){selectedWeather=''}else{el.classList.add('selected');selectedWeather=w}}
function buildColorRow(){document.getElementById('route-color-row').innerHTML=ROUTE_COLORS.map(c=>'<div class="color-dot'+(c===selectedRouteColor?' selected':'')+'" style="background:'+c+'" onclick="selectColor(this,\''+c+'\')"></div>').join('')}
function selectColor(el,c){document.querySelectorAll('.color-dot').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');selectedRouteColor=c}
function resetPinForm(){document.getElementById('pin-note').value='';document.getElementById('pin-photo-preview').style.display='none';pendingPinPhoto=null;pendingPinLatLng=null;editingPinId=null;relocatingPin=false;selectedEmoji='📍';document.getElementById('pin-location-hint').style.display='none';buildEmojiGrid()}
function resetImportForm(){document.getElementById('route-name').value='';document.getElementById('route-story').value='';document.getElementById('gpx-file-input').value='';pendingGPXData=null;editingRouteId=null;selectedMood='😊';selectedWeather='';selectedTags=[];selectedRouteColor='#C9A96E';buildMoodGrid();buildWeatherGrid();buildTagGrid();buildColorRow()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
</script>
