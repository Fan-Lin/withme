<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#1C3829"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<title>WithMe</title>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
:root{--bg:#0f1f18;--surface:#1a2e23;--surface2:#243d2f;--border:#2d5240;--gold:#C9A96E;--gold-dim:#8a7050;--text:#e8e0d0;--text-dim:#8a9e8f;--red:#c97070;--font-display:'Cormorant Garamond',serif;--font-body:'DM Sans',sans-serif;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
[data-theme="classic"]{--bg:#1a1208;--surface:#2a1f0f;--surface2:#362a14;--border:#5a4020;--gold:#D4A853;--gold-dim:#8a6830;--text:#f0e6cc;--text-dim:#9a8060;--red:#c07060;--font-display:'Noto Serif SC',serif}
[data-theme="journal"]{--bg:#f5f0e8;--surface:#ede6d8;--surface2:#e0d8c8;--border:#c8bca8;--gold:#8B6914;--gold-dim:#b89040;--text:#2a2018;--text-dim:#7a6848;--red:#a03030;--font-display:'Caveat',cursive}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column;transition:background .3s,color .3s}
#map{flex:1;width:100%;position:relative;z-index:1}
.leaflet-tile-pane{filter:saturate(.7) brightness(.85)}
[data-theme="journal"] .leaflet-tile-pane{filter:saturate(.5) brightness(1.05) sepia(.2)}
[data-theme="classic"] .leaflet-tile-pane{filter:saturate(.5) brightness(.8) sepia(.3)}
.leaflet-container{background:var(--bg)}
#topbar{position:absolute;top:calc(12px + var(--safe-top));left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:0 16px;pointer-events:none;transition:opacity .2s,transform .2s}
#topbar.hidden{opacity:0;pointer-events:none;transform:translateY(-8px)}
#city-pill{pointer-events:all;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:8px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text);backdrop-filter:blur(8px)}
#city-pill:active{border-color:var(--gold)}
#city-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
#top-actions{pointer-events:all;display:flex;gap:8px}
.top-btn{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px)}
.top-btn:active{background:var(--surface2);border-color:var(--gold)}
#bottom-nav{position:absolute;bottom:calc(24px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:500;background:var(--surface);border:1px solid var(--border);border-radius:32px;padding:6px;display:flex;gap:4px;backdrop-filter:blur(12px)}
.nav-btn{padding:10px 16px;border-radius:26px;border:none;background:transparent;color:var(--text-dim);font-family:var(--font-body);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.nav-btn.active{background:var(--gold);color:#1a1a0e;font-weight:600}
#fab{position:absolute;bottom:calc(104px + var(--safe-bottom));right:20px;z-index:500;width:52px;height:52px;border-radius:50%;background:var(--gold);border:none;color:#1a1a0e;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(201,169,110,.35);transition:transform .15s,opacity .2s}
#fab:active{transform:scale(.93)}
#fab.hidden{opacity:0;pointer-events:none}
#locate-btn{position:absolute;bottom:calc(168px + var(--safe-bottom));right:20px;z-index:500;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);transition:border-color .2s,opacity .2s}
#locate-btn:active{border-color:var(--gold)}
#locate-btn.hidden{opacity:0;pointer-events:none}
#heatmap-btn{position:absolute;bottom:calc(224px + var(--safe-bottom));right:20px;z-index:500;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);transition:border-color .2s,opacity .2s}
#heatmap-btn:active{border-color:var(--gold)}
#heatmap-btn.hidden{opacity:0;pointer-events:none}
#heatmap-btn.active-heat{border-color:var(--gold);background:var(--surface2)}
.panel{position:absolute;inset:0;z-index:400;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
.panel.open{display:flex}
.panel-header{padding:calc(16px + var(--safe-top)) 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.panel-title{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--text);flex:1}
.panel-back{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:none;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.panel-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sheet-overlay{position:absolute;inset:0;z-index:600;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.sheet-overlay.open{display:flex}
.sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding-bottom:calc(24px + var(--safe-bottom));max-height:85dvh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 8px;flex-shrink:0}
.sheet-title{font-family:var(--font-display);font-size:20px;font-weight:600;padding:8px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.sheet-body{padding:16px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:var(--font-body);font-size:15px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:none;min-height:80px;line-height:1.5}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emoji-btn{aspect-ratio:1;border-radius:10px;background:var(--bg);border:1.5px solid var(--border);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,background .15s}
.emoji-btn.selected{border-color:var(--gold);background:rgba(201,169,110,.12)}
.mood-grid,.weather-grid,.tag-grid{display:flex;gap:8px;flex-wrap:wrap}
.mood-btn,.weather-btn,.tag-btn{padding:8px 14px;border-radius:20px;background:var(--bg);border:1.5px solid var(--border);font-size:16px;cursor:pointer;transition:border-color .15s}
.mood-btn.selected,.weather-btn.selected,.tag-btn.selected{border-color:var(--gold);background:rgba(201,169,110,.12)}
.tag-btn{font-size:12px;display:flex;align-items:center;gap:4px}
.btn-primary{width:100%;padding:14px;border-radius:12px;background:var(--gold);border:none;color:#1a1a0e;font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:opacity .15s}
.btn-primary:active{opacity:.85}
.btn-secondary{width:100%;padding:13px;border-radius:12px;background:transparent;border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:15px;cursor:pointer;margin-top:8px}
.btn-secondary:active{border-color:var(--gold)}
.btn-danger{width:100%;padding:13px;border-radius:12px;background:transparent;border:1px solid #5a2020;color:var(--red);font-family:var(--font-body);font-size:15px;cursor:pointer;margin-top:8px}
.diary-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;transition:border-color .2s;position:relative;overflow:hidden}
.diary-card:active{border-color:var(--gold)}
.diary-date{font-size:11px;color:var(--text-dim);margin-bottom:4px;letter-spacing:.05em}
.diary-title{font-family:var(--font-display);font-size:18px;font-weight:600;margin-bottom:6px}
.diary-meta{display:flex;gap:10px;font-size:12px;color:var(--text-dim);flex-wrap:wrap}
.diary-meta span{display:flex;align-items:center;gap:3px}
.diary-story{font-size:13px;color:var(--text-dim);line-height:1.6;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.diary-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.diary-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--text-dim)}
.route-detail-header{padding:20px;border-bottom:1px solid var(--border)}
.route-detail-title{font-family:var(--font-display);font-size:26px;font-weight:600;margin-bottom:4px}
.route-detail-meta{font-size:12px;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap}
.pin-list-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.pin-icon{font-size:24px;flex-shrink:0}
.pin-info{flex:1}
.pin-note{font-size:14px;line-height:1.5}
.pin-time{font-size:11px;color:var(--text-dim);margin-top:2px}
.pin-photo{width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0}
.city-item{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer;gap:12px}
.city-item-name{flex:1;font-size:16px}
.city-item-count{font-size:12px;color:var(--text-dim)}
.city-active-dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.city-delete{width:28px;height:28px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--red);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.city-delete:active{border-color:var(--red)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 30px;text-align:center;gap:12px}
.empty-icon{font-size:48px;opacity:.4}
.empty-text{color:var(--text-dim);font-size:14px;line-height:1.6}
#toast{position:absolute;bottom:calc(100px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);z-index:900;background:var(--surface2);border:1px solid var(--border);border-radius:24px;padding:10px 20px;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pin-marker{width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.3);box-shadow:0 2px 8px rgba(0,0,0,.4);font-size:16px}
.pin-inner{transform:rotate(45deg)}
.import-area{border:2px dashed var(--border);border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:16px}
.import-area:active{border-color:var(--gold)}
.import-area-icon{font-size:32px;margin-bottom:8px}
.import-area-text{font-size:14px;color:var(--text-dim)}
.photo-preview{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-bottom:8px;display:none}
.color-row{display:flex;gap:10px;margin-top:4px}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.color-dot.selected{border-color:var(--text)}
.theme-row{display:flex;gap:10px;margin-top:4px}
.theme-swatch{flex:1;padding:12px 8px;border-radius:12px;border:1.5px solid var(--border);cursor:pointer;text-align:center;font-size:11px;font-weight:500;transition:border-color .15s}
.theme-swatch.selected{border-color:var(--gold)}
.theme-swatch-dot{width:20px;height:20px;border-radius:50%;margin:0 auto 6px}
.lang-toggle{display:flex;background:var(--bg);border-radius:20px;border:1px solid var(--border);overflow:hidden}
.lang-btn{flex:1;padding:8px 12px;border:none;background:transparent;color:var(--text-dim);font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.lang-btn.active{background:var(--gold);color:#1a1a0e;font-weight:600}
.achievement-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ach-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.ach-card.unlocked{border-color:var(--gold);background:rgba(201,169,110,.08)}
.ach-card.locked{opacity:.45}
.ach-icon{font-size:32px;margin-bottom:6px}
.ach-name{font-family:var(--font-display);font-size:14px;font-weight:600;margin-bottom:3px}
.ach-desc{font-size:11px;color:var(--text-dim);line-height:1.4}
.ach-date{font-size:10px;color:var(--gold);margin-top:4px}
#ach-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);z-index:999;background:var(--surface);border:2px solid var(--gold);border-radius:24px;padding:32px 28px;text-align:center;width:280px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
#ach-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:all}
#ach-popup-icon{font-size:52px;margin-bottom:10px}
#ach-popup-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
#ach-popup-name{font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:6px}
#ach-popup-desc{font-size:13px;color:var(--text-dim);line-height:1.5}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.stat-value{font-family:var(--font-display);font-size:28px;font-weight:600;color:var(--gold)}
.stat-label{font-size:11px;color:var(--text-dim);margin-top:3px}
.search-bar{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:var(--font-body);font-size:14px;outline:none;margin-bottom:12px}
.search-bar:focus{border-color:var(--gold)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-grid-item{aspect-ratio:1;border-radius:10px;object-fit:cover;cursor:pointer;border:1px solid var(--border)}
.photo-grid-item:active{border-color:var(--gold)}
#postcard-preview{background:var(--surface);border-radius:16px;overflow:hidden;margin-bottom:16px}
#postcard-canvas{width:100%;display:block}
.replay-bar{position:absolute;bottom:calc(88px + var(--safe-bottom));left:16px;right:16px;z-index:500;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 16px;display:none;align-items:center;gap:12px;backdrop-filter:blur(12px)}
.replay-bar.show{display:flex}
.replay-progress{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.replay-fill{height:100%;background:var(--gold);transition:width .3s linear}
.replay-close{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div id="map"></div>
<div id="topbar">
  <div id="city-pill" onclick="openCityManager()"><div class="dot"></div><span id="city-name-display">选择城市</span></div>
  <div id="top-actions">
    <button class="top-btn" onclick="openImportSheet()">＋</button>
    <button class="top-btn" onclick="openSettingsSheet()">⚙</button>
  </div>
</div>
<button id="heatmap-btn" onclick="toggleHeatmap()">🔥</button>
<button id="locate-btn" onclick="locateMe()">◎</button>
<button id="fab" onclick="startPinMode()">📍</button>
<div id="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('map')" id="nav-map">地图</button>
  <button class="nav-btn" onclick="switchTab('diary')" id="nav-diary">日记</button>
  <button class="nav-btn" onclick="switchTab('routes')" id="nav-routes">路线</button>
  <button class="nav-btn" onclick="switchTab('photos')" id="nav-photos">相册</button>
  <button class="nav-btn" onclick="switchTab('achievements')" id="nav-achievements">成就</button>
</div>
<div class="replay-bar" id="replay-bar"><span id="replay-label">回放中</span><div class="replay-progress"><div class="replay-fill" id="replay-fill"></div></div><button class="replay-close" onclick="stopReplay()">✕</button></div>

<div class="panel" id="panel-diary">
  <div class="panel-header"><div class="panel-title" id="title-diary">探城日记</div></div>
  <div class="panel-body"><input class="search-bar" id="search-diary" placeholder="搜索路线…" oninput="renderDiary()"/><div id="diary-list"></div></div>
</div>
<div class="panel" id="panel-routes">
  <div class="panel-header"><div class="panel-title" id="title-routes">全部路线</div></div>
  <div class="panel-body"><input class="search-bar" id="search-routes" placeholder="搜索路线…" oninput="renderRoutes()"/><div id="routes-list"></div></div>
</div>
<div class="panel" id="panel-photos">
  <div class="panel-header"><div class="panel-title" id="title-photos">照片墙</div></div>
  <div class="panel-body" id="photos-body"></div>
</div>
<div class="panel" id="panel-achievements">
  <div class="panel-header"><div class="panel-title" id="title-achievements">探索成就</div></div>
  <div class="panel-body"><div class="stats-grid" id="stats-grid"></div><div class="achievement-grid" id="achievement-grid"></div></div>
</div>
<div class="panel" id="panel-route-detail">
  <div class="panel-header"><button class="panel-back" onclick="closeRouteDetail()">←</button><div class="panel-title" id="route-detail-title"></div></div>
  <div class="panel-body" id="route-detail-body"></div>
</div>

<!-- PIN SHEET -->
<div class="sheet-overlay" id="sheet-pin"><div class="sheet"><div class="sheet-handle"></div>
  <div class="sheet-title" id="sheet-pin-title">📍 新标记</div>
  <div class="sheet-body">
    <div class="field"><label id="lbl-icon">图标</label><div class="emoji-grid" id="pin-emoji-grid"></div></div>
    <div class="field"><label id="lbl-note">备注（可选）</label><textarea id="pin-note" placeholder="在这里遇见了什么…"></textarea></div>
    <div class="field"><label id="lbl-photo">照片（可选）</label><img id="pin-photo-preview" class="photo-preview"/><input type="file" id="pin-photo-input" accept="image/*" style="display:none" onchange="handlePinPhoto(this)"/><button class="btn-secondary" id="btn-choose-photo" onclick="document.getElementById('pin-photo-input').click()">选择照片</button></div>
    <button class="btn-primary" id="btn-save-pin" onclick="savePin()">保存标记</button>
    <button class="btn-secondary" id="btn-cancel-pin" onclick="closeSheet('sheet-pin')">取消</button>
  </div>
</div></div>

<!-- IMPORT/EDIT ROUTE SHEET -->
<div class="sheet-overlay" id="sheet-import"><div class="sheet"><div class="sheet-handle"></div>
  <div class="sheet-title" id="sheet-import-title">导入路线</div>
  <div class="sheet-body">
    <div id="gpx-import-area" class="import-area" onclick="document.getElementById('gpx-file-input').click()">
      <div class="import-area-icon">🗺</div>
      <div class="import-area-text" id="import-hint">点击选择 GPX / KML 文件</div>
    </div>
    <input type="file" id="gpx-file-input" accept=".gpx,.kml" style="display:none" onchange="handleTrackFile(this)"/>
    <div class="field"><label id="lbl-route-name">路线名称</label><input type="text" id="route-name" placeholder="这次去哪了…"/></div>
    <div class="field"><label id="lbl-story">故事（可选）</label><textarea id="route-story" placeholder="写下这次探城的感受…"></textarea></div>
    <div class="field"><label id="lbl-mood">心情</label><div class="mood-grid" id="route-mood-grid"></div></div>
    <div class="field"><label id="lbl-weather">天气</label><div class="weather-grid" id="route-weather-grid"></div></div>
    <div class="field"><label id="lbl-tags">标签</label><div class="tag-grid" id="route-tag-grid"></div></div>
    <div class="field"><label id="lbl-color">路线颜色</label><div class="color-row" id="route-color-row"></div></div>

function tkm(d){return d.routes.reduce((s,r)=>s+(parseFloat(r.km)||0),0)}

// ── IndexedDB ──
const DBNAME='withme-photos';
let photoDB=null;
function openPhotoDB(){return new Promise((res,rej)=>{if(photoDB)return res(photoDB);const req=indexedDB.open(DBNAME,1);req.onupgradeneeded=e=>{e.target.result.createObjectStore('photos')};req.onsuccess=e=>{photoDB=e.target.result;res(photoDB)};req.onerror=()=>rej()})}
async function savePhoto(id,data){const db=await openPhotoDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(data,id);tx.oncomplete=()=>res();tx.onerror=()=>rej()})}
async function getPhoto(id){const db=await openPhotoDB();return new Promise((res)=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').get(id);req.onsuccess=()=>res(req.result||null);req.onerror=()=>res(null)})}
async function deletePhoto(id){const db=await openPhotoDB();return new Promise((res)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res()})}
async function getAllPhotos(){const db=await openPhotoDB();return new Promise((res)=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').getAll();const reqK=tx.objectStore('photos').getAllKeys();let vals,keys;req.onsuccess=()=>{vals=req.result};reqK.onsuccess=()=>{keys=reqK.result};tx.oncomplete=()=>{const r={};keys.forEach((k,i)=>r[k]=vals[i]);res(r)};tx.onerror=()=>res({})})}

// ── STORAGE ──
function getData(){try{return JSON.parse(localStorage.getItem('withme_data')||'{"cities":[],"routes":[],"pins":[],"activeCity":null,"unlockedAch":[],"achDates":{}}');}catch{return{cities:[],routes:[],pins:[],activeCity:null,unlockedAch:[],achDates:{}}}}
function saveData(d){localStorage.setItem('withme_data',JSON.stringify(d))}
function getPrefs(){try{return JSON.parse(localStorage.getItem('withme_prefs')||'{"lang":"zh","theme":"default","signature":""}');}catch{return{lang:'zh',theme:'default',signature:''}}}

// ── INIT ──
document.addEventListener('DOMContentLoaded',async()=>{

  await migratePhotos();loadMapData();checkAchievements(false);
});

async function migratePhotos(){
  const d=getData();let changed=false;
  for(const pin of d.pins){
    if(pin.photo&&!pin.hasPhoto){
      await savePhoto(pin.id,pin.photo);
      delete pin.photo;pin.hasPhoto=true;changed=true;
    }
  }
  if(changed)saveData(d);
}

function t(k){return(T[currentLang]||T.zh)[k]||k}

// ── MAP ──
function initMap(){
  map=L.map('map',{zoomControl:false,attributionControl:true}).setView([30.5728,104.0668],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
  map.on('click',onMapClick);
}
function loadMapData(){
  const d=getData();
  document.getElementById('city-name-display').textContent=d.activeCity||t('selectCity');
  d.routes.filter(r=>r.city===d.activeCity).forEach(drawRoute);
  d.pins.filter(p=>p.city===d.activeCity).forEach(drawPin);
}
function clearMapLayers(){map.eachLayer(l=>{if(l instanceof L.Polyline||l instanceof L.CircleMarker||l instanceof L.Marker)map.removeLayer(l)})}

let pinMode=false;
function startPinMode(){if(!getData().activeCity){toast(t('selectCityFirst'));return}pinMode=true;document.getElementById('fab').textContent='✕';document.getElementById('fab').onclick=cancelPinMode;toast(t('tapMapPin'))}
function cancelPinMode(){pinMode=false;document.getElementById('fab').textContent='📍';document.getElementById('fab').onclick=startPinMode}
function onMapClick(e){if(!pinMode)return;pendingPinLatLng=e.latlng;cancelPinMode();editingPinId=null;document.getElementById('sheet-pin-title').textContent=t('newPin');document.getElementById('btn-save-pin').textContent=t('savePin');openSheet('sheet-pin')}

function locateMe(){
  if(!navigator.geolocation){toast(t('locateFail'));return}
  toast(t('locating'));
  navigator.geolocation.getCurrentPosition(pos=>{
    const{latitude:lat,longitude:lng}=pos.coords;map.setView([lat,lng],17);
    if(locateMarker)map.removeLayer(locateMarker);
    locateMarker=L.circleMarker([lat,lng],{radius:8,color:'#4A90D9',fillColor:'#4A90D9',fillOpacity:.9,weight:3}).addTo(map);
    toast(t('located'));
  },()=>toast(t('locateFail')),{enableHighAccuracy:true,timeout:10000});
}

function drawRoute(route){
  if(!route.coords||!route.coords.length)return;
  const c=route.color||'#C9A96E';
  const poly=L.polyline(route.coords,{color:c,weight:3,opacity:.85}).addTo(map);
  poly.on('click',()=>openRouteDetail(route.id));
  L.circleMarker(route.coords[0],{radius:5,color:c,fillColor:c,fillOpacity:1,weight:2}).addTo(map);
  L.circleMarker(route.coords[route.coords.length-1],{radius:7,color:c,fillColor:'#1C3829',fillOpacity:1,weight:2}).addTo(map);
}
function drawPin(pin){
  const icon=L.divIcon({html:'<div class="pin-marker" style="background:'+(pin.color||'#1C3829')+'"><span class="pin-inner">'+(pin.emoji||'📍')+'</span></div>',className:'',iconSize:[36,36],iconAnchor:[18,36]});
  L.marker([pin.lat,pin.lng],{icon}).addTo(map).on('click',()=>openPinDetail(pin.id));
}

// ── PARSE GPX/KML ──
function parseGPX(text){const xml=new DOMParser().parseFromString(text,'application/xml');const c=[];xml.querySelectorAll('trkpt').forEach(p=>{const la=parseFloat(p.getAttribute('lat')),lo=parseFloat(p.getAttribute('lon'));if(!isNaN(la)&&!isNaN(lo))c.push([la,lo])});return c}
function parseKML(text){const xml=new DOMParser().parseFromString(text,'application/xml');const c=[];xml.querySelectorAll('coordinates').forEach(el=>{el.textContent.trim().split(/\s+/).forEach(s=>{const[lon,lat]=s.split(',').map(Number);if(!isNaN(lat)&&!isNaN(lon))c.push([lat,lon])})});return c}
function handleTrackFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const txt=e.target.result;
    pendingGPXData=file.name.endsWith('.kml')?parseKML(txt):parseGPX(txt);
    if(pendingGPXData.length>0){toast('✓ '+pendingGPXData.length+' '+t('trackPoints'));document.getElementById('route-name').value=file.name.replace(/\.(gpx|kml)$/i,'').replace(/_/g,' ')}
    else toast('No track data found');
  };reader.readAsText(file);
}
function handlePinPhoto(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{pendingPinPhoto=e.target.result;const p=document.getElementById('pin-photo-preview');p.src=e.target.result;p.style.display='block'};
  reader.readAsDataURL(file);
}

// ── SAVE ──
async function savePin(){
  const d=getData();const note=document.getElementById('pin-note').value.trim();
  if(editingPinId){
    const pin=d.pins.find(p=>p.id===editingPinId);if(!pin){closeSheet('sheet-pin');return}

function calcDist(c){let t=0;for(let i=1;i<c.length;i++)t+=L.latLng(c[i-1]).distanceTo(L.latLng(c[i]));return(t/1000).toFixed(1)}

function isNearRoute(pin,route){
  if(!route.coords||!route.coords.length)return true;
  const pll=L.latLng(pin.lat,pin.lng);
  for(let i=0;i<route.coords.length;i+=Math.max(1,Math.floor(route.coords.length/50))){
    if(pll.distanceTo(L.latLng(route.coords[i]))<500)return true;
  }return false;
}

function startReplay(id){

function openPostcard(id){
  const d=getData(),r=d.routes.find(x=>x.id===id);if(!r)return;
  closeRouteDetail();
  const date=new Date(r.date);
  const ds=currentLang==='zh'?date.getFullYear()+'年'+(date.getMonth()+1)+'月'+date.getDate()+'日':date.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('pc-name').textContent=(r.mood||'')+' '+r.name;
  document.getElementById('pc-date').textContent=ds+(r.weather?' '+r.weather:'');
  document.getElementById('pc-story').textContent=(r.story||'').slice(0,120)+(r.story&&r.story.length>120?'…':'');
  document.getElementById('pc-meta').innerHTML=(r.km?'<span>🚶 '+r.km+' km</span>':'')+'<span>'+(r.coords?.length||0)+' '+t('trackPoints')+'</span>';
  const sig=getPrefs().signature;document.getElementById('pc-sig').textContent=sig?'— '+sig:'';
  // draw route on canvas
  const canvas=document.getElementById('postcard-canvas');const ctx=canvas.getContext('2d');
  canvas.width=600;canvas.height=300;
  ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--bg').trim()||'#0f1f18';ctx.fillRect(0,0,600,300);
  if(r.coords.length>1){
    const lats=r.coords.map(c=>c[0]),lons=r.coords.map(c=>c[1]);
    const minLat=Math.min(...lats),maxLat=Math.max(...lats),minLon=Math.min(...lons),maxLon=Math.max(...lons);
    const pad=30,w=600-pad*2,h=300-pad*2;
    const scale=Math.min(w/(maxLon-minLon||1),h/(maxLat-minLat||1));
    ctx.strokeStyle=r.color||'#C9A96E';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.globalAlpha=.8;ctx.beginPath();
    r.coords.forEach((c,i)=>{
      const x=pad+(c[1]-minLon)*scale;const y=pad+(maxLat-c[0])*scale;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });ctx.stroke();
    ctx.globalAlpha=1;ctx.fillStyle=r.color||'#C9A96E';
    const s=r.coords[0],e=r.coords[r.coords.length-1];
    ctx.beginPath();ctx.arc(pad+(s[1]-minLon)*scale,pad+(maxLat-s[0])*scale,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(pad+(e[1]-minLon)*scale,pad+(maxLat-e[0])*scale,6,0,Math.PI*2);ctx.fill();
  }
  document.getElementById('btn-save-postcard').textContent=t('saveImage');
  openSheet('sheet-postcard');
}
function savePostcard(){
  const el=document.getElementById('postcard-inner');
  html2canvas(el,{backgroundColor:null,scale:2}).then(canvas=>{
    const link=document.createElement('a');link.download='withme-postcard.png';link.href=canvas.toDataURL();link.click();
    toast(currentLang==='zh'?'明信片已保存':'Postcard saved');
  }).catch(()=>toast('Export failed'));
}

function saveSignature(){const p=getPrefs();p.signature=document.getElementById('signature-input').value;savePrefs(p)}

// ── BACKUP ──
async function exportBackup(){
  const d=getData();const photos=await getAllPhotos();d._photos=photos;
  const blob=new Blob([JSON.stringify(d)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='withme-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  URL.revokeObjectURL(a.href);delete d._photos;toast(t('backupExported'));
}
async function importBackup(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();reader.onload=async e=>{
    try{
      const data=JSON.parse(e.target.result);if(!data.routes||!data.pins)throw 0;
      if(data._photos){for(const[k,v]of Object.entries(data._photos))await savePhoto(k,v);delete data._photos}
      data.pins.forEach(p=>{if(p.photo){savePhoto(p.id,p.photo);p.hasPhoto=true;delete p.photo}});
      localStorage.setItem('withme_data',JSON.stringify(data));toast(t('backupRestored'));
    }catch{toast(t('backupInvalid'))}
  };reader.readAsText(file);
}

// ── TABS ──
function switchTab(tab){
  ['map','diary','routes','photos','achievements'].forEach(id=>{
    document.getElementById('nav-'+id).classList.toggle('active',id===tab);
    if(id!=='map')document.getElementById('panel-'+id).classList.toggle('open',id===tab);
  });
  const isMap=tab==='map';
  document.getElementById('topbar').classList.toggle('hidden',!isMap);
  document.getElementById('fab').classList.toggle('hidden',!isMap);
  document.getElementById('locate-btn').classList.toggle('hidden',!isMap);
  document.getElementById('heatmap-btn').classList.toggle('hidden',!isMap);
  if(tab==='diary')renderDiary();if(tab==='routes')renderRoutes();
  if(tab==='achievements')renderAchievements();if(tab==='photos')renderPhotos();
}

// ── SHEETS ──
function openSheet(id){document.getElementById(id).classList.add('open')}
function closeSheet(id){document.getElementById(id).classList.remove('open')}
function openImportSheet(){if(!getData().activeCity){toast(t('selectCityFirst'));return}editingRouteId=null;document.getElementById('sheet-import-title').textContent=t('importRoute');document.getElementById('btn-save-route').textContent=t('saveRoute');document.getElementById('gpx-import-area').style.display='block';openSheet('sheet-import')}
function openSettingsSheet(){openSheet('sheet-settings')}
document.querySelectorAll('.sheet-overlay').forEach(o=>{o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open')})});

// ── BUILDERS ──
function buildEmojiGrid(){document.getElementById('pin-emoji-grid').innerHTML=PIN_EMOJIS.map(e=>'<div class="emoji-btn'+(e===selectedEmoji?' selected':'')+'" onclick="selectEmoji(this,\''+e+'\')">'+e+'</div>').join('')}
function selectEmoji(el,e){document.querySelectorAll('.emoji-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');selectedEmoji=e}
function buildMoodGrid(){document.getElementById('route-mood-grid').innerHTML=MOODS.map(m=>'<div class="mood-btn'+(m===selectedMood?' selected':'')+'" onclick="selectMood(this,\''+m+'\')">'+m+'</div>').join('')}
function selectMood(el,m){document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');selectedMood=m}
function buildWeatherGrid(){document.getElementById('route-weather-grid').innerHTML=WEATHERS.map(w=>'<div class="weather-btn'+(w===selectedWeather?' selected':'')+'" onclick="selectWeather(this,\''+w+'\')">'+w+'</div>').join('')}
function selectWeather(el,w){document.querySelectorAll('.weather-btn').forEach(b=>b.classList.remove('selected'));if(selectedWeather===w){selectedWeather='';el.classList.remove('selected')}else{el.classList.add('selected');selectedWeather=w}}
function buildTagGrid(){
  const tags=currentLang==='zh'?TAGS_ZH:TAGS_EN;
  const icons=['🍜','🛍','🌙','🌿','🏛','🎲'];
  document.getElementById('route-tag-grid').innerHTML=tags.map((tg,i)=>'<div class="tag-btn'+(selectedTags.includes(tg)?' selected':'')+'" onclick="toggleTag(this,\''+tg+'\')">'+icons[i]+' '+tg+'</div>').join('');
}
function toggleTag(el,tg){if(selectedTags.includes(tg)){selectedTags=selectedTags.filter(t=>t!==tg);el.classList.remove('selected')}else{selectedTags.push(tg);el.classList.add('selected')}}
function buildColorRow(){document.getElementById('route-color-row').innerHTML=ROUTE_COLORS.map((c,i)=>'<div class="color-dot'+(c===selectedRouteColor?' selected':'')+'" style="background:'+c+'" onclick="selectColor(this,\''+c+'\')"></div>').join('')}
function selectColor(el,c){document.querySelectorAll('.color-dot').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');selectedRouteColor=c}
function resetPinForm(){document.getElementById('pin-note').value='';document.getElementById('pin-photo-preview').style.display='none';pendingPinPhoto=null;pendingPinLatLng=null;editingPinId=null;selectedEmoji='📍';buildEmojiGrid()}
function resetImportForm(){document.getElementById('route-name').value='';document.getElementById('route-story').value='';document.getElementById('gpx-file-input').value='';pendingGPXData=null;editingRouteId=null;selectedMood='😊';selectedWeather='';selectedTags=[];selectedRouteColor='#C9A96E';buildMoodGrid();buildWeatherGrid();buildTagGrid();buildColorRow()}

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
</script>
